name: sstf

services:
  api:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.api
    ports:
      - "${API_PORT:-8080}:8080"
    env_file:
      - ../.env
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DATA_PATH: /data
    volumes:
      - ../backend:/app
      - api_vendor:/app/vendor
      - ../data:/data
    working_dir: /app
    command: >
      sh -c "composer install --no-interaction --prefer-dist
      && php -S 0.0.0.0:8080 -t public public/index.php"

  web:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.web
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      API_PROXY_TARGET: http://api:8080
    volumes:
      - ../frontend:/app
      - web_node_modules:/app/node_modules
    working_dir: /app
    command: >
      sh -c "npm install
      && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - api

volumes:
  api_vendor:
  web_node_modules:
