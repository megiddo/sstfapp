name: sstf

# Dev stack. SQLite and sessions live on the host at ../data (bind-mounted
# at /data), same folder as compose.prod.yml. Named volumes are only for
# vendor and node_modules so Google Drive does not sync them.

services:
  api:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.api
    ports:
      - "${API_PORT:-8080}:8080"
    env_file:
      - ../.env
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DATA_PATH: /data
      SESSION_PATH: /data/sessions
      SESSION_SECRET: ${SESSION_SECRET:-dev-insecure-session-secret-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - ../backend:/app
      - api_vendor:/app/vendor
      - ../data:/data
    working_dir: /app
    command: >
      sh -c "composer install --no-interaction --prefer-dist
      && php -S 0.0.0.0:8080 -t public public/index.php"

  web:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.web
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      API_PROXY_TARGET: http://api:8080
      PUBLIC_GOOGLE_CLIENT_ID: ${PUBLIC_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
    volumes:
      - ../frontend:/app
      - web_node_modules:/app/node_modules
    working_dir: /app
    command: >
      sh -c "npm install
      && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - api

volumes:
  api_vendor:
  web_node_modules:
